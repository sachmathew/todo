<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
    <linke rel="canonical" href="https://sachmathew.github.io/todo/" />
    <linke rel="manifest" href="/todo/manifest.webmanifest" />
    <link rel="stylesheet" href="/todo/style.css" />
	  <link rel="icon" href="/todo/icons/small.svg" />
  </head>
  <body>
    <!-- <nav>
      <button class="todo-button" onclick="toggleTabs('date-todo')">TODO</button>
      <button class="log-button" onclick="toggleTabs('todo-log')">LOG</button>
    </nav> -->
      <main>
      <section class="date-todo">
        <form id="date-search">
          <fieldset>
            <input type="date" id="date" name="date" required />
          </fieldset>
        </form>
        <section class="todo-list">
          <ul>
            <form id="add-todo">
              <fieldset id="todo-list-elements">
                <li class="add-todo-li, adder">
                  <input type="text" id="add-todo-text" name="add-todo-text"/><button type="submit" id="add-todo-submit" class="right-button">+</button>
                </li>
              </fieldset>
            </form>
          </ul>
        </section>
      </section>

      <section class="todo-log">
        <section id="weekly">
          <h1>WEEKLY TODOS</h1>
          <ul>
            <form id="add-weekly">
              <fieldset id="weekly-elements">
                <li class="add-weekly-li, adder">
                  <input type="text" id="add-weekly-text" name="add-weekly-text" class="list-text"/><div class="inner-buttons"><input type="checkbox" id="mon_add" name="mon_add"/><label for="mon_add">M</label><input type="checkbox" id="tue_add" name="tue_add"/><label for="tue_add">T</label><input type="checkbox" id="wed_add" name="wed_add"/><label for="wed_add">W</label><input type="checkbox" id="thu_add" name="thu_add"/><label for="thu_add">T</label><input type="checkbox" id="fri_add" name="fri_add"/><label for="fri_add">F</label><input type="checkbox" id="sat_add" name="sat_add"/><label for="sat_add">S</label><input type="checkbox" id="sun_add" name="sun_add"/><label for="sun_add">S</label><button type="submit" id="add-weekly-submit" class="right-button">+</button></div>
                </li>
              </fieldset>
            </form>
          </ul>
        </section>
        <!-- <section id="monthly"></section> -->
      </section>
    </main>

    <script src="app.js" defer></script>
    <script>
		if (navigator.serviceWorker) {
		  navigator.serviceWorker.register("/todo/sw.js", {scope: "/todo/"}).then(
			(registration) => {
			  console.log("Service worker registration successful:", registration);
			},
			(error) => {
			  console.error(`Service worker registration failed: ${error}`);
			},
		  );
		} else {
		  console.error("Service workers are not supported.");
		}
    </script>
  </body>
</html>
